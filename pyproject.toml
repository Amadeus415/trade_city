[project]
name = "agentic-fund"
version = "0.1.0"
description = "Point-in-time disciplined agentic equity trading system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "pandas>=2.2",
    "numpy>=2.1",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "httpx>=0.28",
    "tenacity>=9.0",
    "click>=8.1",
    "pandas-market-calendars>=4.4",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.8",
]

[project.scripts]
fund = "fund.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
